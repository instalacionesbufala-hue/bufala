<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Búfala Tech — He llegado</title>
<!-- BÚFALA — Botón «HE LLEGADO» · llegada.html v1.0.0 (27/10/2026)
     v1.0.0: el técnico pulsa el botón al llegar a una obra de InstantBox o de
     cliente directo; se guarda la hora del servidor (y la posición si la da)
     en 📍 Llegadas (acción registrarLlegada). Es la hora de inicio del cierre.
     Historial: HISTORIAL.md (repo privado panel-src). ⚠️ Aquí, máximo 5 entradas. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--grafito:#2d2b29;--dorado:#c9a46e;--crema:#f6f2ec;--borde:#e3d9cb}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--crema);color:var(--grafito);min-height:100vh;display:flex;flex-direction:column}
.cab{background:var(--grafito);color:var(--crema);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;font-weight:800;letter-spacing:1px;font-size:13px}
.main{flex:1;max-width:520px;width:100%;margin:0 auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.obra{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px 16px}
.obra .cli{font-size:19px;font-weight:800}
.obra .num{font-size:14px;color:#5c5650;margin-top:3px}
h1{font-size:24px;margin:4px 0 0}
p{margin:0;color:#5c5650;font-size:15px;line-height:1.4}
#boton{border:0;border-radius:20px;background:var(--dorado);color:var(--grafito);font-family:inherit;font-size:28px;font-weight:800;letter-spacing:1px;padding:34px 16px;min-height:120px;box-shadow:0 6px 0 #a8834f}
#boton:active{transform:translateY(3px);box-shadow:0 3px 0 #a8834f}
#boton[disabled]{opacity:.6}
.msg{border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;display:none}
.ok{display:block;background:#e9f2e4;border:2px solid #8fb07a;color:#2f4a1f}
.error{display:block;background:#fbece7;border:2px solid #d9805e;color:#7a2d12}
.espera{display:block;background:#f7ecd9;border:2px solid var(--dorado);color:#5a3b0a}
</style>
</head>
<body>
<div class="cab">BÚFALA · LLEGADA A LA INSTALACIÓN</div>
<div class="main">
  <div class="obra"><div class="cli" id="cli">—</div><div class="num" id="num">—</div></div>
  <h1>¿Ya estás en la instalación?</h1>
  <p>Pulsa el botón al llegar. Se guarda la hora de inicio de la instalación.</p>
  <button type="button" id="boton" onclick="registrar()">📍 HE LLEGADO</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxMMeyP9g75p1lxytithxeFfQVbe0cXV3aFHlJObfI05ewIN1mtTxPYBNPYp--BPKc9tw/exec';
const p = new URLSearchParams(location.search);
const obra = { numInst: (p.get('numInst') || '').trim(), equipo: p.get('equipo') || '', cliente: p.get('cliente') || '' };
document.getElementById('cli').textContent = obra.cliente || 'Obra';
document.getElementById('num').textContent = [obra.numInst, obra.equipo].filter(Boolean).join(' · ') || '—';
function aviso(cls, txt){ const m = document.getElementById('msg'); m.className = 'msg ' + cls; m.textContent = txt; }
function posicion(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(pos => res(pos.coords), () => res(null), { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 });
  });
}
async function registrar(){
  if (!obra.numInst){ aviso('error', 'El enlace no trae el número de la obra. Avisa a la oficina.'); return; }
  const b = document.getElementById('boton'); b.disabled = true;
  aviso('espera', 'Registrando la llegada… no cierres esta pantalla.');
  const c = await posicion();
  const datos = Object.assign({ accion: 'registrarLlegada' }, obra, c ? { lat: c.latitude, lng: c.longitude, precision: c.accuracy } : {});
  for (let intento = 0; intento < 2; intento++){
    try {
      const form = new URLSearchParams(); form.set('payload', JSON.stringify(datos));
      const r = await (await fetch(WEB_APP_URL, { method: 'POST', body: form, redirect: 'follow' })).json();
      if (r && r.ok){ aviso('ok', '✅ Llegada registrada a las ' + r.hora + '. Ya puedes empezar.'); b.textContent = '✅ LLEGADA REGISTRADA'; return; }
      aviso('error', (r && r.motivo) || 'No se ha podido registrar.'); b.disabled = false; return;
    } catch (e) { if (intento === 0) await new Promise(r => setTimeout(r, 3000)); }
  }
  aviso('error', 'Sin conexión con la oficina. Vuelve a pulsar en un momento.'); b.disabled = false;
}
</script>
</body>
</html>
